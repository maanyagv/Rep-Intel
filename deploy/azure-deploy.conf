# Azure deploy settings for Rep-Tell (committed; NOTHING SECRET goes in here).
#
# Read by deploy/azure.sh, deploy/github-setup.sh, deploy/azure-frontend.sh,
# deploy/env-import.sh and the GitHub workflows .github/workflows/azure.yml
# (backend) and .github/workflows/azure-frontend.yml (website). No GitHub
# Actions variables or secrets are used. The scripts fill in the "written by"
# lines; the last setup script then prints the git command that publishes
# this file. The workflows skip quietly until the values they need are here.
#
# None of these values are secrets: the IDs grant nothing on their own (only
# GitHub runs on main of this repository can sign in with them), and the
# WEB_ENV_ values are public (they end up inside the website's JavaScript).
# API keys and passwords live only in .env.azure (never committed) and in the
# container app's secrets.
#
# Format: KEY=value, one per line, no quotes, no spaces around "=".

# --- Project: everything in Azure is named after APP_NAME ---
# Resource group <app>, container app <app>, deploy identity <app>-github,
# registry <app without dashes><first 8 hex of the subscription>, image
# <registry>.azurecr.io/<app>, Static Web App <app>-web. Settings in
# .env.azure are named KEY_rep_tell. Lower-case letters, digits and dashes;
# starts with a letter; max 32 chars; must differ from every other app in the
# shared environment.
APP_NAME=rep-tell
# GitHub repository (owner/name) whose main branch may deploy. Not used for
# any Azure name.
GITHUB_REPO=maanyagv/Rep-Intel
# Numeric owner and repository IDs (gh api repos/<owner>/<repo>), for the
# ID form of GitHub's OIDC subject. github-setup.sh re-checks them.
GITHUB_OWNER_ID=192491430
GITHUB_REPO_ID=1464179270

# --- Current host ---
# None: the project has no Render/Vercel/other hosting config. Settings come
# from a local .env file or are typed in (deploy/env-import.sh).

# --- Azure subscription and region ---
AZURE_SUBSCRIPTION_ID=82aaf9d4-d161-4dab-8ecf-dff34de35353
AZURE_LOCATION=centralindia

# --- Shared Container Apps environment (read only: never created or changed) ---
ACA_ENV_NAME=purva-bot-env
ACA_ENV_RESOURCE_GROUP=purva-bot

# --- Container app size ---
# Cheap health route (no database, no network call): backend/main.py /api/health.
HEALTH_PATH=/api/health
# vCPU and memory per replica (valid pairs: 0.25/0.5Gi, 0.5/1Gi, 0.75/1.5Gi ...).
# Measured with docker stats (2026-11-20): the work is CPU, not memory. Memory
# never went above 128MiB. The collector loop alone averages 0.05 vCPU. Each
# open dashboard asks for 5 API routes every 10 s, and each one re-reads and
# filters the whole dataset, so CPU is what makes it slow:
#   0.25/0.5Gi, 3 viewers: CPU full, median 10.7 s, slowest 5% 23 s (unusable)
#   0.5/1Gi,    1 viewer:  median 0.66 s, slowest 5% 2.3 s
#   0.5/1Gi,    3 viewers: median 1.9 s,  slowest 5% 5.3 s
#   0.75/1.5Gi, 1 viewer:  median 0.38 s, slowest 5% 1.0 s
#   0.75/1.5Gi, 3 viewers: median 1.1 s,  slowest 5% 2.9 s
# 0.5/1Gi is used (cheaper always-on); go to CPU=0.75 MEMORY=1.5Gi if
# several people keep the dashboard open at once (edit, rerun deploy/azure.sh).
CPU=0.5
MEMORY=1Gi
# 1 = always on: backend/main.py runs a collector loop every 30 s (YouTube,
# news, Reddit, ...) that must keep running even when nobody has the site open.
MIN_REPLICAS=1
# Must stay 1: the collector loop, its status and the dataset (JSON files in
# backend/data/) live inside the one running copy. A second copy would run
# the collectors twice and show different data depending on which copy answers.
MAX_REPLICAS=1

# --- Written by deploy/azure.sh ---
# Container registry (Basic) for this project only.
ACR_NAME=reptell82aaf9d4
# Public address of the container app (the API the website calls).
BACKEND_URL=https://rep-tell.lemonfield-c4c1d145.centralindia.azurecontainerapps.io

# --- Written by deploy/github-setup.sh ---
# Client ID of the deploy identity <app>-github, and the Azure tenant.
AZURE_CLIENT_ID=155f583a-f381-4070-a745-481ef3a193ca
AZURE_TENANT_ID=994a6b1b-9716-479f-8871-5cba672279aa

# --- Written by deploy/azure-frontend.sh: the website (Azure Static Web Apps) ---
# Static Web App <app>-web (Free plan) and its address.
STATIC_WEB_APP_NAME=rep-tell-web
WEBSITE_URL=https://lemon-ocean-055a17300.4.azurestaticapps.net

# --- Website build settings (public; passed to "npm run build" without the
# WEB_ENV_ prefix) ---
# The address of the backend that the website calls. deploy/azure-frontend.sh
# copies it from BACKEND_URL. Required: the website workflow stops if empty.
# Note: frontend/src/App.jsx does not read VITE_API_URL yet (it has
# 'http://127.0.0.1:8000' written in). The website workflow therefore also
# replaces that address in the built files with this value; once the code
# reads import.meta.env.VITE_API_URL, that replacement simply finds nothing.
WEB_ENV_VITE_API_URL=https://rep-tell.lemonfield-c4c1d145.centralindia.azurecontainerapps.io
